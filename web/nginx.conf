server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service worker and manifest must never be long-cached, or installed
    # PWA clients won't pick up updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: /dashboard/* and /customer/* are client-side routes
    # (react-router), not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
